name: Validate evidence ledger

# The rigor is enforced by CI: every technique must carry a grade, at least one
# primary source, and an ISO date. A PR that adds an ungraded/unsourced claim fails.

on:
  push:
    branches: [main]
    paths: ['data/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - run: pip install --quiet pyyaml
      - name: The ledger says what the repository promises
        run: python3 scripts/validate-ledger.py
